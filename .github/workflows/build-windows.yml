# Builds the Windows recovery program, proves it works, and records where it came from.
#
# The point of building here rather than on a laptop is that anyone can check the result:
# the run is public, the inputs are a commit, and the attestation ties the binary back to
# both. A customer is asked to run this program against their seed phrase -- "trust me"
# is not an answer, and a hash they can compare is.
#
# Copyright (C) 2026 tristanjo. Part of btcrecover, GNU GPL v2 or later.

name: Build Windows recovery program

on:
  push:
    # Tags are what produce a release. main also builds, because a break that only shows
    # up on Windows should surface on the commit that caused it, rather than on a tag
    # pushed to find out.
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_attestation:
        description: "Record build provenance (tags do this automatically)"
        type: boolean
        default: false

# One run per branch at a time: a newer push supersedes an older one, so a slow or hung
# job cannot pile up behind the fix for it. Tags are exempt -- a release build should
# never be cancelled by something arriving after it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  id-token: write        # for the provenance attestation
  attestations: write

env:
  # coincurve publishes wheels through 3.13; 3.14 has none and would silently fall back
  # to the pure-Python secp256k1, which is correct and about two orders of magnitude
  # slower. Pinning the interpreter is also the first requirement for a reproducible build.
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: windows-latest
    # A hang here is not hypothetical: the search spawns worker processes, and a build
    # that waits forever costs the same as one that fails, only quietly and for hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Check which secp256k1 backend got selected
        # Ask what btcrecover actually chose, rather than whether some library imports:
        # either C backend is fine, and the pure-Python one is correct but around a
        # hundredth of the speed, announced by nothing louder than a warning.
        run: |
          python -c "from btcrecover import crypto_backends as c; print('secp256k1 backend:', c.BACKEND_NAME); raise SystemExit(0 if c.BACKEND_NAME in ('coincurve', 'wallycore') else 'fell back to the pure-Python backend')"

      - name: Run the tests for the code this fork adds
        timeout-minutes: 10
        # Only the suites covering what this fork wrote. The upstream suites -- test_seeds
        # and test_passwords -- are deliberately absent: upstream's own CI runs them on
        # Ubuntu only ("Test Ubuntu Only", with a 20 minute timeout for slow tests), so
        # nobody has ever run them on Windows, and this build job is not the place to find
        # out. What this job needs to answer is whether the Windows binary works, and the
        # self-test below answers that end to end -- real PBKDF2, real BIP32 derivation,
        # real worker processes, in the binary that ships.
        #
        # Each module in its own process: test_seeds and test_passwords share global state
        # in btcrpass and cannot be collected together, which is how run-all-tests.py does
        # it too.
        run: |
          python -m unittest btcrecover.test.test_passphrase_grammar
          python -m unittest btcrecover.test.test_cjk_passphrase
          python -m unittest btcrecover.test.test_embed
          python -m unittest btcrecover.test.test_recovery_gui

      - name: Anchor the build clock to the commit
        # Two builds of one commit should have a chance of matching byte for byte, which
        # they cannot if timestamps come from whenever the runner happened to start.
        run: |
          $epoch = git show -s --format=%ct HEAD
          echo "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV

      - name: Build
        run: pyinstaller --noconfirm --clean recovery_gui.spec

      - name: Self-test the built program
        timeout-minutes: 5
        # The binary tested here is the one that ships. A windowed Windows build has no
        # stdout, so the exit code carries the verdict and --report carries the detail.
        run: |
          $ErrorActionPreference = "Continue"
          dist\passphrase-recovery\passphrase-recovery.exe --self-test --report self-test.txt
          $code = $LASTEXITCODE
          Write-Host "exit code: $code"
          Write-Host "working directory: $(Get-Location)"
          if (Test-Path self-test.txt) {
            Write-Host "--- self-test.txt ---"
            Get-Content self-test.txt
          } else {
            Write-Host "self-test.txt was not written; files here:"
            Get-ChildItem -Name | Select-Object -First 30
          }
          if ($code -ne 0) { Write-Error "self-test exited $code"; exit 1 }

      - name: Check the built program kept its crypto backend
        # The report names the backend the frozen program actually selected. Grepping for
        # the fallback's warning would not work: it is written to stderr at import time,
        # before the program can capture anything.
        run: |
          if (-not (Test-Path self-test.txt)) { Write-Error "no self-test report to check"; exit 1 }
          if (-not (Select-String -Path self-test.txt -Pattern "secp256k1 backend: (coincurve|wallycore)" -Quiet)) {
            Get-Content self-test.txt
            Write-Error "the built program did not select a C secp256k1 backend"
            exit 1
          }

      - name: Package
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/","" } else { $env:GITHUB_SHA.Substring(0,7) }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Copy-Item self-test.txt dist\passphrase-recovery\
          $name = "passphrase-recovery-$version-windows"
          Compress-Archive -Path dist\passphrase-recovery -DestinationPath "$name.zip"
          echo "PACKAGE=$name" >> $env:GITHUB_ENV

      - name: Publish the hash
        # This is the number a customer compares against what they downloaded. It belongs
        # in the run log, where it cannot be edited after the fact.
        run: |
          $hash = (Get-FileHash "$env:PACKAGE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:PACKAGE.zip" | Tee-Object -FilePath "$env:PACKAGE.zip.sha256"
          echo "### SHA256" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          echo "$hash  $env:PACKAGE.zip" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.zip.sha256
          if-no-files-found: error

      - name: Record build provenance
        # Lets anyone verify the binary came from this repository at this commit:
        #   gh attestation verify passphrase-recovery-*.zip --repo tristanjo/recover
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_attestation
        # Attestations need a public repository (or a paid plan). Until this one goes
        # public that is expected, and it must not fail a build that is otherwise sound --
        # the binary and its hash are still produced. Once public, watch this step: the
        # verifiable chain from commit to binary is the whole reason for building here.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.PACKAGE }}.zip
